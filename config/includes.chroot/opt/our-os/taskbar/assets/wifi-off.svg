<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#14192d"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>

    <!-- Signal Arc Gradient (Dimmed/Offline) -->
    <linearGradient id="neonCyanDim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff007b" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Core Dot Gradient (Dimmed/Offline) -->
    <radialGradient id="dotPulseDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7000ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff007b" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Strike Cut Mask: Clean Windows-style separation gap -->
    <mask id="strikeCutout">
      <rect width="500" height="500" fill="#ffffff" />
      <line x1="120" y1="410" x2="380" y2="100" stroke="#000000" stroke-width="46" stroke-linecap="round" />
    </mask>

    <!-- Vibrant Strike Gradient -->
    <linearGradient id="strikeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Glow Filter for Waves -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- High-Intensity Strike Glow -->
    <filter id="strikeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="90" fill="url(#bgGlow)"/>

  <!-- Framing Rings -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#neonCyanDim)" stroke-opacity="0.2" stroke-dasharray="8 16" stroke-width="2"/>

  <!-- Wi-Fi Arcs with Slash Cutout Applied -->
  <g mask="url(#strikeCutout)" filter="url(#softGlow)" stroke-linecap="round">
    <!-- Outer Arc -->
    <path d="M 105 160 A 190 190 0 0 1 395 160" 
          fill="none" 
          stroke="url(#neonCyanDim)" 
          stroke-width="24"/>

    <!-- Middle Arc -->
    <path d="M 155 220 A 130 130 0 0 1 345 220" 
          fill="none" 
          stroke="url(#neonCyanDim)" 
          stroke-width="24"/>

    <!-- Inner Arc -->
    <path d="M 205 280 A 70 70 0 0 1 295 280" 
          fill="none" 
          stroke="url(#neonCyanDim)" 
          stroke-width="24"/>

    <!-- Center Pulse Dot -->
    <circle cx="250" cy="355" r="18" fill="url(#dotPulseDim)"/>
    <circle cx="250" cy="355" r="7" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Neon "Off" Diagonal Strike -->
  <g filter="url(#strikeGlow)">
    <line x1="120" y1="410" x2="380" y2="100" 
          stroke="url(#strikeGrad)" 
          stroke-width="22" 
          stroke-linecap="round"/>
    
    <!-- White Core Filament -->
    <line x1="120" y1="410" x2="380" y2="100" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.9"/>
  </g>
</svg>
