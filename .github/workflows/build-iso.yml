name: Build OUR OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OUR OS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Debian ISO
        run: |
          docker run --privileged --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -c '
              set -e

              echo "========================================"
              echo "INSTALLING BUILD TOOLS"
              echo "========================================"

              apt-get update

              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build \
                debootstrap \
                debian-archive-keyring \
                xorriso \
                squashfs-tools \
                grub-pc-bin \
                grub-efi-amd64-bin \
                mtools \
                dosfstools \
                ca-certificates

              echo "========================================"
              echo "CLEANING PREVIOUS BUILD"
              echo "========================================"

              lb clean --purge || true

              echo "========================================"
              echo "VERIFYING PACKAGE LIST"
              echo "========================================"

              echo "--- PACKAGE LIST CONTENT ---"

              if [ ! -f "config/package-lists/our-os.list.chroot" ]; then
                echo "ERROR: Package list file not found!"
                exit 1
              fi

              cat config/package-lists/our-os.list.chroot

              echo "========================================"
              echo "PACKAGE LIST FILES"
              echo "========================================"

              ls -la config/package-lists/

              echo "========================================"
              echo "VERIFYING GUI PACKAGES"
              echo "========================================"

              grep -E "^(xfce4|xfce4-goodies|lightdm|network-manager-gnome|xorg)$" \
                config/package-lists/our-os.list.chroot

              echo "GUI package list verification passed."

              echo "========================================"
              echo "CONFIGURING OUR OS"
              echo "========================================"

              lb config \
                --distribution trixie \
                --architectures amd64 \
                --binary-images iso-hybrid \
                --mirror-bootstrap https://deb.debian.org/debian \
                --mirror-binary https://deb.debian.org/debian \
                --mirror-chroot https://deb.debian.org/debian \
                --archive-areas "main contrib non-free non-free-firmware" \
                --apt-recommends true \
                --firmware-binary true \
                --firmware-chroot true \
                --iso-application "OUR OS" \
                --iso-publisher "OUR OS Project" \
                --iso-volume "OUR-OS"

              echo "========================================"
              echo "BUILDING ISO"
              echo "========================================"

              lb build 2>&1 | tee build.log

              echo "========================================"
              echo "CHECKING GENERATED ISO"
              echo "========================================"

              if [ ! -f "./live-image-amd64.hybrid.iso" ]; then
                echo "ERROR: ISO was not generated."
                exit 1
              fi

              ls -lh "./live-image-amd64.hybrid.iso"

              echo "========================================"
              echo "ISO BUILD SUCCESSFUL"
              echo "========================================"
            '

      - name: Locate ISO
        run: |
          echo "========================================"
          echo "CHECKING GENERATED ISO"
          echo "========================================"

          ISO="./live-image-amd64.hybrid.iso"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: ISO was not created."
            exit 1
          fi

          echo "Found: $ISO"

          sudo cp "$ISO" "our-os-$(cat VERSION)-amd64.iso"
          sudo chmod 644 "our-os-$(cat VERSION)-amd64.iso"

          ls -lh "our-os-$(cat VERSION)-amd64.iso"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: our-os-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7