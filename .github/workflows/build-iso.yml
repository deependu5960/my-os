name: Build OUR OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OUR OS ISO
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates

      - name: Show build environment
        run: |
          echo "=== OS ==="
          cat /etc/os-release

          echo "=== live-build ==="
          lb --version

          echo "=== debootstrap ==="
          debootstrap --version

      - name: Configure OUR OS
        run: |
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends true \
            --firmware-binary true \
            --firmware-chroot true \
            --iso-application "OUR OS" \
            --iso-publisher "OUR OS Project" \
            --iso-volume "OUR-OS"

      - name: Show generated configuration
        run: |
          echo "=== config directory ==="
          find config -maxdepth 3 -type f -print 2>/dev/null || true

          echo "=== auto/config ==="
          cat config/auto/config 2>/dev/null || true

      - name: Build ISO
        run: |
          set -o pipefail
          lb build 2>&1 | tee build.log

      - name: Inspect build
        if: always()
        run: |
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          echo "=== Root ==="
          ls -lah

          echo "=== ISO files ==="
          find . -type f \
            \( -name "*.iso" -o -name "*.hybrid.iso" \) \
            -print

          echo "=== binary/ ==="
          ls -lah binary/ 2>/dev/null || true

          echo "=== Last 200 log lines ==="
          tail -n 200 build.log 2>/dev/null || true

      - name: Prepare ISO artifact
        run: |
          ISO=$(find . -type f \
            \( -name "*.iso" -o -name "*.hybrid.iso" \) \
            -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was created."
            exit 1
          fi

          echo "ISO found at: $ISO"

          cp "$ISO" \
            "our-os-$(cat VERSION)-amd64.iso"

          ls -lh "our-os-$(cat VERSION)-amd64.iso"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: our-os-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7