name: Build OUR OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools \
            syslinux-utils

      - name: Configure Debian live system
        run: |
          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends true \
            --firmware-binary true \
            --firmware-chroot true \
            --iso-application "OUR OS" \
            --iso-publisher "OUR OS Project" \
            --iso-volume "OUR-OS"

      - name: Build ISO
        run: |
          sudo lb build 2>&1 | tee build.log

      - name: Inspect build output
        if: always()
        run: |
          echo "========================================"
          echo "CURRENT DIRECTORY"
          echo "========================================"
          pwd

          echo "========================================"
          echo "ROOT FILES"
          echo "========================================"
          ls -lah

          echo "========================================"
          echo "ALL ISO FILES"
          echo "========================================"
          sudo find . -type f \
            \( -name "*.iso" -o -name "*.hybrid.iso" \) \
            -print

          echo "========================================"
          echo "BINARY DIRECTORY"
          echo "========================================"
          sudo ls -lah binary/ 2>/dev/null || true

          echo "========================================"
          echo "BUILD LOG - LAST 150 LINES"
          echo "========================================"
          tail -n 150 build.log

      - name: Locate and rename ISO
        run: |
          ISO=$(sudo find . -type f \
            \( -name "*.iso" -o -name "*.hybrid.iso" \) \
            -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: live-build did not create an ISO."
            exit 1
          fi

          echo "Found ISO:"
          echo "$ISO"

          sudo cp "$ISO" \
            "our-os-$(cat VERSION)-amd64.iso"

          sudo chown "$USER:$USER" \
            "our-os-$(cat VERSION)-amd64.iso"

          echo "Final ISO:"
          ls -lh "our-os-$(cat VERSION)-amd64.iso"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: our-os-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7